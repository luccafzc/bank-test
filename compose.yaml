services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: aurora
      MYSQL_USER: aurora
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD no arquivo .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: aurora
      MYSQL_USER: aurora
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD no arquivo .env}
    volumes:
      - aurora_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  aurora_mysql:
